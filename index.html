<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标题+文案批量生成器 · 情感/生活号</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2329; --sub:#6b7280;
    --line:#e5e7eb; --accent:#2f6fed; --ok:#1a9c5b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.8;padding:16px 14px 40px;}
  .wrap{max-width:820px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .tip{color:var(--sub);font-size:13px;margin:0 0 14px;}
  .bar{position:sticky;top:0;background:rgba(245,246,248,.92);
    backdrop-filter:blur(6px);padding:10px 0;display:flex;gap:10px;
    align-items:center;margin-bottom:8px;z-index:5;}
  .count{color:var(--sub);font-size:13px;flex:1;}
  .cardbox{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin:12px 0;}
  .cardbox h2{font-size:14px;margin:0 0 10px;color:var(--accent);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  input[type=number]{width:80px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;}
  textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;
    padding:9px;font-size:13px;font-family:inherit;resize:vertical;margin-top:8px;}
  label.s{font-size:13px;color:var(--sub);}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;}
  button{background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:9px 16px;font-size:14px;cursor:pointer;}
  button.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent);}
  .art{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin:14px 0;}
  .ttl{font-size:17px;font-weight:700;line-height:1.5;margin:0 0 4px;}
  .meta{font-size:12px;color:var(--sub);margin-bottom:10px;}
  .dup{color:#bbb;margin-left:6px;}
  .pill{display:inline-block;background:#eef3ff;color:var(--accent);border-radius:6px;
    padding:1px 8px;margin-right:6px;}
  .body p{margin:9px 0;font-size:14px;text-align:justify;}
  .btrow{display:flex;gap:8px;margin-top:12px;}
  .copyone,.aiBtn{font-size:12px;padding:6px 12px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1f2329;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;
    opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>标题 + 文案批量生成器</h1>
  <p class="tip">标题 = 称呼×句式×选题钩子；每篇标题自动带上所属选题的成稿正文（排版好、无编号、可直接粘贴公众号）。自定义选题用通用正文模板。</p>

  <div class="bar">
    <span class="count" id="count">已生成 0 篇</span>
    <label class="s"><input type="checkbox" id="titleOnly"> 只出标题</label>
    <button class="ghost" id="copyAll">复制全部</button>
    <button id="genBtn">生成</button>
  </div>

  <div class="cardbox">
    <h2>设置</h2>
    <div class="row">
      <label class="s">篇数</label>
      <input type="number" id="num" value="3" min="1" max="60">
      <label class="s">（上限 60，正文较长避免卡顿）</label>
    </div>
    <label class="s">自定义选题钩子（每行一条，留空则用内置 8 类；自定义项用通用正文模板）：</label>
    <textarea id="custom" placeholder="例：&#10;一个人在出租屋的第365天&#10;和前任彻底断开联系的那个晚上&#10;35岁裸辞后第一次睡到自然醒"></textarea>
    <div class="hint">提示：内置 8 类（搞钱副业/护肤美妆/健康养生/母婴育儿/家居好物/穿搭形象/自我成长/美食生活）均为高变现赛道成稿（每篇 300+ 字、无编号、可直接粘贴公众号）；自定义项会套通用模板，建议点对应卡片的「AI 扩写提示」复制 prompt 去 AI 精修。</div>
  </div>

  <div id="out"></div>
</div>
<div class="toast" id="toast"></div>

<script src="content.js"></script>
<script>

function loveFrame(h){return `关于「${h}」，我其实想说点一直没说出口的话。

我们总以为一段关系的动摇是突然发生的，其实不是。是无数个深夜里的沉默、一次次欲言又止、还有那些假装没看见的冷淡，一点点把缝隙撑大的。你不是突然不爱了，你只是累了——累了反复解释却还是不被懂。

你是不是也这样？明明心里翻江倒海，嘴上却只说"没事"。把委屈咽下去，把期待藏起来，等到真的走了，别人才惊讶"怎么一点征兆都没有"。可征兆早就有了，只是没人愿意先伸手。

感情里最可惜的，从来不是不爱，是明明还在乎，却用错了方式。争吵、冷战、试探，都是在笨拙地确认"你还重不重要"。

关于「${h}」，你最想被听见的那句话是什么？评论区告诉我，我替你记着。`;}

function familyFrame(h){return `今天想聊聊「${h}」。

我们和家人的关系，常常从"最熟悉的忽视"开始。同一屋檐下却各自刷着手机；明明牵挂，开口却只剩"吃饭了吗""早点睡"。我们以为来日方长，把最软的话留到以后，可"以后"总被生活推着往后挪。

你是不是也有过这样的瞬间：某天突然发现，爸妈的动作慢了、记性差了，或者孩子悄无声息长高了。那一刻心里一酸，却什么也没说，只是转身去忙别的。

亲人之间最深的爱，往往没有盛大的表达。是一碗多煮五分钟的粥，是视频里那句别扭的"记得吃饭"，是明明想你却只发一个表情包。

关于「${h}」，你最想对家里的谁说句什么？评论区告诉我，我替你记着。`;}

function workFrame(h){return `「${h}」这几个字，光是看见就让人胸口发紧。

成年人的世界，好像默认要把疲惫藏好。白天在工位上撑着，晚上回家还要把笑脸摆正。我们这代人，谁不是一边说"还行"，一边在通勤路上发呆；一边喊"想辞职"，一边准时打卡。不是不想逃，是身后的房贷、孩子的学费、父母的药，把"任性"两个字悄悄划掉了。

你是不是也常在车里、在卫生间、在关灯后的床头，任性地 emo 十分钟？那不是矫情，那是一个人仅剩的、不用扮演任何角色的时刻。

累不可耻。承认"我有点撑不住了"，反而才是把自己拉回来的第一步。

关于「${h}」，你最近一次松口气是在什么时候？评论区聊聊。`;}

function sceneFrame(h){return `今天，「${h}」这条消息刷到我的时候，我愣了好几秒。

有些画面天生带着一种说不清的引力——不是因为它多震撼，而是它突然把日常的琐碎撕开一道口子，让你看见生活之外，还有更大的、更安静的东西。我们活得太低头了，低头赶路、低头焦虑，差点忘了抬头看看世界原来会长这样。

你是不是也有过类似的时刻？某天抬头，被一片云、一阵风、或者某个不真实的瞬间轻轻撞了一下。那一秒，什么 KPI、什么烦恼，忽然都轻了。

这些风景不负责解决任何问题，它们只是提醒你：你先是个人，才是个赶路的人。

关于「${h}」，你见过最让你安静下来的那个画面是什么？评论区告诉我。`;}

function selfFrame(h){return `关于「${h}」，我想先抱抱你。

我们太习惯用"应该"绑架自己：应该合群、应该稳定、应该时刻有用。一旦落在标准之外——一个人住、暂时迷茫、或者只是想喘口气——就开始责怪自己"是不是不行"。可你忘了，人不是机器，停顿不是故障。

你是不是也曾在深夜里问自己：我到底想要什么？答案往往不在热搜里，不在别人的期待里，而在你独处时那点诚实的安静里。

把自己重新找回来的过程，本来就慢，也本来就值得。允许自己偶尔掉队，允许目标模糊，允许今天只做一件取悦自己的小事。

关于「${h}」，你最近一次纯粹为自己开心是在什么时候？评论区说给我听。`;}

function defaultFrame(h){return `今天想跟你聊聊「${h}」这件事。

说真的，太多时候我们面对它选择沉默，或者假装无所谓。我们习惯轻轻掠过，好像不提，它就不曾发生；好像不承认，就不用面对。

你是不是也曾在某个瞬间，被它轻轻硌了一下？那种说不清的堵，不像大事，却总在深夜冒出来，比白天的忙乱更难对付。

其实没关系，慢慢来。看清它，就已经往前走了一步。你不需要立刻想通，也不需要向谁证明什么，只要愿意正视，就已经比昨天的自己勇敢。

关于「${h}」，你有什么想说的？评论区告诉我，我替你记着。`;}

function genericBody(hook){
  const frames = [
    { keys:["分手","离婚","出轨","暗恋","异地","结婚","冷战","前任","恋","爱","喜欢"], fn: loveFrame },
    { keys:["妈","爸","外婆","爷爷","奶奶","儿子","女儿","孩子","父母","亲情","家"], fn: familyFrame },
    { keys:["加班","辞职","35岁","工资","老板","同事","职场","失业","创业","班"], fn: workFrame },
    { keys:["杭州","北京","上海","城市","雪","月","海","山","雨","风","天","风景","分界线","自然","景"], fn: sceneFrame },
    { keys:["独处","一个人","迷茫","孤独","减肥","学习","成长","自己","宅"], fn: selfFrame }
  ];
  for(const f of frames){ if(f.keys.some(k=>hook.includes(k))) return f.fn(hook); }
  return defaultFrame(hook);
}

const out = document.getElementById('out');
const countEl = document.getElementById('count');
const toast = document.getElementById('toast');
let last = [];
let copyCount = {};
try { copyCount = JSON.parse(localStorage.getItem('tcopy_copycount')) || {}; } catch(e) { copyCount = {}; }

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderBody(str){
  return '<div class="body">' + str.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('') + '</div>';
}
function weightedSample(arr, weights, n){
  if(!arr.length || n<=0) return [];
  const scored = arr.map((item,i)=>({item, s: Math.random()*weights[i]}));
  scored.sort((a,b)=>b.s-a.s);
  return scored.slice(0,n).map(x=>x.item);
}

function gen(){
  const custom = document.getElementById('custom').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const keyOf = (c)=> c.title + "|||" + c.body;

  const builtin = [];
  for(const t of TOPICS)
    for(const h of t.hooks)
      for(const c of CALLINGS)
        for(const w of WRAPS)
          builtin.push({title:w(c,h), body:t.body, cat:t.cat});

  let customCombos = [];
  if(custom.length){
    const customTopics = custom.map(h=>({cat:"自定义",hooks:[h],body:genericBody(h)}));
    for(const t of customTopics)
      for(const h of t.hooks)
        for(const c of CALLINGS)
          for(const w of WRAPS)
            customCombos.push({title:w(c,h), body:t.body, cat:t.cat});
  }

  const totalAll = customCombos.length + builtin.length;
  let n = parseInt(document.getElementById('num').value,10) || 3;
  n = Math.min(Math.max(n,1), Math.min(totalAll,60));

  const wCustom = customCombos.map(c=>1/(1+(copyCount[keyOf(c)]||0)*3));
  const wBuiltin = builtin.map(c=>1/(1+(copyCount[keyOf(c)]||0)*3));
  const pickedCustom = customCombos.length ? weightedSample(customCombos, wCustom, Math.min(n, customCombos.length)) : [];
  const remain = Math.max(0, n - pickedCustom.length);
  const pickedBuiltin = weightedSample(builtin, wBuiltin, remain);
  const combos = pickedCustom.concat(pickedBuiltin);

  last = combos.slice(0,n);

  const titleOnly = document.getElementById('titleOnly').checked;
  out.innerHTML = '';
  last.forEach((it,i)=>{
    const art = document.createElement('div');
    art.className = 'art';
    const kc = copyCount[it.title + "|||" + it.body] || 0;
    const copyLabel = kc>0 ? `已复制 ${kc} 次` : '复制此篇';
    const dupHtml = ` <span class="dup" id="dup-${i}">${kc>0 ? '已复制'+kc+'次' : ''}</span>`;
    let html = `<div class="ttl">${esc(it.title)}</div><div class="meta"><span class="pill">${esc(it.cat)}</span>第 ${i+1} 篇${dupHtml}</div>`;
    if(!titleOnly) html += renderBody(it.body);
    html += `<div class="btrow">
      <button class="ghost copyone" data-i="${i}">${copyLabel}</button>
      <button class="ghost aiBtn" data-i="${i}">AI 扩写提示</button>
    </div>`;
    art.innerHTML = html;
    out.appendChild(art);
  });

  countEl.textContent = `已生成 ${last.length} 篇（候选池 ${totalAll}）`;
  out.querySelectorAll('.copyone').forEach(b=>{
    b.addEventListener('click',()=>{
      const it = last[+b.dataset.i];
      const k = it.title + "|||" + it.body;
      copyCount[k] = (copyCount[k] || 0) + 1;
      try { localStorage.setItem('tcopy_copycount', JSON.stringify(copyCount)); } catch(e) {}
      copyText(it.title + '\n\n' + it.body);
      b.textContent = '已复制 ' + copyCount[k] + ' 次';
      const dup = document.getElementById('dup-'+b.dataset.i);
      if(dup) dup.textContent = '已复制'+copyCount[k]+'次';
      showToast('已复制第 '+(+b.dataset.i+1)+' 篇（累计'+copyCount[k]+'次）');
    });
  });
  out.querySelectorAll('.aiBtn').forEach(b=>{
    b.addEventListener('click',()=>{
      const it = last[+b.dataset.i];
      copyText(buildPrompt(it));
      showToast('已复制第 '+(+b.dataset.i+1)+' 篇 · AI 扩写 prompt');
    });
  });
}

function buildPrompt(it){
  const isCustom = it.cat === "自定义";
  const task = isCustom
    ? "下面是一份已按选题套好叙事框架的草稿。请严格按草稿的骨架（见下）扩写成一篇完整、出彩、可直接发布的文案，补足具体画面与真实细节，不要偏离框架另写。"
    : "下面是一篇已有稿件。请严格按它的骨架与叙事走向做润色/扩写（补足更具体的画面细节、更自然的表达），保持同等质量，不要另起结构、也不要换切入点重写。";
  const refLabel = isCustom ? "【现有草稿（已套叙事框架，待按骨架扩写）】" : "【现有稿件（请按同一骨架润色，勿改结构）】";
  return `你是公众号情感/生活号写作助手。${task}

【标题】${it.title}
【选题方向】${it.cat}
${refLabel}
${it.body}

【必须遵守的文案骨架】（严格按顺序产出，不要另起炉灶、不要打乱段落）
1. 开头：以"亲爱的/宝子"等亲昵称呼起笔，接选题钩子，1–2 句点题。
2. 场景叙事：用 1–2 个具体、可感的真实生活画面展开，有细节、有温度，不空泛说教。
3. 共情转折：点出读者共同的情绪或处境，把感受说透。
4. 结尾：用一句真诚的提问引导评论互动（不引战、不骗赞）。

要求：
1. 保留原标题（或微调得更自然）。
2. 严格保留上面 4 段骨架与叙事走向，只在表达上润色、补细节、让文字更出彩；不要改变结构、不要改用 123 编号、不要列点。
3. 不少于 300 字，加入具体画面细节与真实情绪。
4. 语气亲切克制，符合"亲爱的/宝子"开头的情感号风格。
5. 不虚构资质、不承诺无法兑现的效果、不引导加微信。

请直接输出完整文案（标题 + 正文），不要多余解释。`;
}

function copyText(t){
  navigator.clipboard.writeText(t).then(()=>{},()=>fallbackCopy(t));
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
}
function showToast(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);}

document.getElementById('genBtn').addEventListener('click', gen);
document.getElementById('copyAll').addEventListener('click', ()=>{
  if(!last.length){showToast('先生成再复制');return;}
  const btns = out.querySelectorAll('.copyone');
  if(!btns.length){showToast('没有可复制的篇');return;}
  const parts = [];
  btns.forEach(b=>{ const it = last[+b.dataset.i]; const k = it.title + "|||" + it.body; copyCount[k] = (copyCount[k]||0)+1; parts.push(it.title + '\n\n' + it.body); b.textContent = '已复制 ' + copyCount[k] + ' 次'; const dup = document.getElementById('dup-'+b.dataset.i); if(dup) dup.textContent = '已复制'+copyCount[k]+'次'; });
  try { localStorage.setItem('tcopy_copycount', JSON.stringify(copyCount)); } catch(e) {}
  copyText(parts.join('\n\n——————\n\n'));
  showToast(`已复制 ${btns.length} 篇`);
});
document.getElementById('titleOnly').addEventListener('change', gen);

gen();
</script>
</body>
</html>
